# Local development and test database, mirroring production: the same Postgres image as the cluster's, and the same
# roles (an owner plus non-owner runtime roles, as the cluster's provisioning creates them). See ADR-0001 and
# ADR-0002.
#
#   pnpm db:up               # start Postgres on :5434 (override with BACKOFFICE_PG_PORT)
#   pnpm db:migrate          # apply migrations and refresh db/schema.sql
#   docker compose down -v   # stop and wipe the database

services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: backoffice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      BACKOFFICE_OWNER_PASSWORD: ${BACKOFFICE_OWNER_PASSWORD:-dev-only-owner}
      BACKOFFICE_APP_PASSWORD: ${BACKOFFICE_APP_PASSWORD:-dev-only-app}
      BACKOFFICE_AUTH_PASSWORD: ${BACKOFFICE_AUTH_PASSWORD:-dev-only-auth}
      BACKOFFICE_INGEST_PASSWORD: ${BACKOFFICE_INGEST_PASSWORD:-dev-only-ingest}
      BACKOFFICE_PUBLIC_PASSWORD: ${BACKOFFICE_PUBLIC_PASSWORD:-dev-only-public}
    ports:
      - '${BACKOFFICE_PG_PORT:-5434}:5432'
    volumes:
      - backoffice-pg-data:/var/lib/postgresql
      - ./db/local/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pauseai_backoffice']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backoffice-pg-data:
