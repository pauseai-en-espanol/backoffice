<!--
  PauseAI en Español — circular brand mark, chapter version (no wordmark).

  Clean orange circle (radius 452.5, centered in the chapter's natural
  905 x 929 canvas) with the chapter's signature ñ-tilde decoration on
  top — a horizontal curvy white shape near the top of the mark that
  hints at the "ñ" of "Español". The two white rects underneath show
  the P-stem counterforms.

  Differs from `pauseai-global-mark.svg`:
    - Uses a clean `<circle>` + explicit white overlays (chapter
      construction style), rather than the global's evenodd-cutout
      compound path + backing ellipse.
    - Includes the ñ-tilde decoration unique to the Spanish chapter.

  Path 1 (the ñ-tilde) is the original chapter element extracted from
  `pauseai-es-on-light.svg`. The P-stem rects are the chapter's
  counterforms, also from the source. The orange circle is new — it
  replaces the chapter's compound mark path, which had a notch on the
  right where the wordmark normally attaches in the full lockup.

  Colors:
    #FF9416  PauseAI orange — the outer circle
    #FFFFFF  paper white — ñ-tilde decoration + the two P-stem
             counterforms

  DO NOT edit colors or paths in this file. To add new variants, copy
  to a new file and document it in `brand/logos/README.md`.
-->
