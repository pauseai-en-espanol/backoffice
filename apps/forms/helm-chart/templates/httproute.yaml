{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "backoffice-forms.fullname" . }}
  labels:
    {{- include "backoffice-forms.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "route.parentRefs is required when route.enabled" .Values.route.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "route.hostnames is required when route.enabled" .Values.route.hostnames) | nindent 4 }}
  rules:
    # Everything on the form's host goes to the form; no /api here (ADR-0002 §7): its server calls the API inside the
    # cluster, so nothing of the API is reachable from this host.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "backoffice-forms.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
