{{- if and .Values.route.enabled .Values.route.trafficPolicy.enabled }}
{{- $limits := .Values.route.trafficPolicy.rateLimit | default dict }}
{{- $submit := int ($limits.submit | default 0) }}
{{- $form := int ($limits.form | default 0) }}
{{- $errorRelay := int ($limits.errorRelay | default 0) }}
# Envoy Gateway policy for the form host's HTTPRoute (as the staff host's). One policy per route: Envoy Gateway refuses
# a second one targeting it as conflicting, so the rate limits live here too.
# - retry connection-level failures only (never 5xx), so an answer that may have been saved is never sent twice;
# - close idle upstream connections (60s) before the pods would (keep-alive 75s), avoiding reset races;
# - per-client-address limits on what anyone can post (ADR-0001, ADR-0002 §7), when values set them.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "backoffice-forms.fullname" . }}
  labels:
    {{- include "backoffice-forms.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "backoffice-forms.fullname" . }}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset
  timeout:
    http:
      connectionIdleTimeout: 60s
  {{- if or (gt $submit 0) (gt $form 0) (gt $errorRelay 0) }}
  # Global limits: only Envoy Gateway's rate-limit service counts each client address apart (Distinct), IPv4 and IPv6
  # alike. It must be on before any number is set: without it Envoy Gateway answers every request of this route with
  # a 500. Counted per address and per rule. The path is matched whole, query included.
  rateLimit:
    global:
      rules:
        {{- range $cidr := list "0.0.0.0/0" "::/0" }}
        {{- if gt $submit 0 }}
        - clientSelectors:
            - sourceCIDR: { type: Distinct, value: {{ $cidr | quote }} }
              methods: [{ value: POST }]
              path: { type: RegularExpression, value: '/enviar(\?.*)?' }
          limit: { requests: {{ $submit }}, unit: Minute }
        {{- end }}
        {{- if gt $form 0 }}
        - clientSelectors:
            - sourceCIDR: { type: Distinct, value: {{ $cidr | quote }} }
              methods: [{ value: POST }]
              path: { type: RegularExpression, value: '/formulario(\?.*)?' }
          limit: { requests: {{ $form }}, unit: Minute }
        {{- end }}
        {{- if gt $errorRelay 0 }}
        - clientSelectors:
            - sourceCIDR: { type: Distinct, value: {{ $cidr | quote }} }
              methods: [{ value: POST }]
              path: { type: PathPrefix, value: /_relay/errors }
          limit: { requests: {{ $errorRelay }}, unit: Minute }
        {{- end }}
        {{- end }}
  {{- end }}
{{- end }}
