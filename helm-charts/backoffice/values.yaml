# Image tags are written by the release workflow (.github/workflows/release.yml). Everything environment-specific
# (hostnames, gateway, registry, secrets) lives in the gitops values for each environment, not here.
#
# The nameOverrides name each deployable's pods: the API's network policy admits the web app's pods by theirs (web)
# and the forms app's by theirs (forms), so rename one, rename both (scripts/check-network-policies.mjs checks they
# match).
backoffice-migrations:
  nameOverride: migrations
  image:
    tag: '0.9.4.4b7c44e'
backoffice-api:
  nameOverride: api
  image:
    tag: '0.11.5.4b7c44e'
backoffice-web:
  nameOverride: web
  image:
    tag: '0.15.3.4b7c44e'
backoffice-forms:
  nameOverride: forms
  image:
    tag: '0.1.22.4b7c44e'
