packages:
  - apps/*
  - packages/*
  - db
  - e2e

# Wait 3 days (4320 min) after a version is published before installing it
# (supply-chain hardening); keep in sync with minimumReleaseAge in renovate.json5.
minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@slango/*'
  - '@slango.configs/*'
  # Renovate security update: nodemailer@10.1.4
  - nodemailer@10.1.4

injectWorkspacePackages: true
linkWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# Packages allowed to run install scripts; add entries deliberately, one by one.
allowBuilds:
  # native file watcher, pulled in by next-intl
  '@parcel/watcher': true
  # native SWC binary, pulled in by next-intl
  '@swc/core': true

# better-auth lists framework integrations as optional peers, and pnpm fills them from the workspace (the web app's
# Next.js and React, the test runner): `pnpm deploy --prod` then put Next.js, Playwright and Vitest in the API's
# image, doubling it. The API uses none of them; '-' drops each from better-auth's peers.
overrides:
  'better-auth>next': '-'
  'better-auth>react': '-'
  'better-auth>react-dom': '-'
  'better-auth>vitest': '-'
